name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@^11.5.1

      - run: npm ci

      # Authenticates with npm trusted publishing (npmjs.com -> package settings ->
      # Trusted Publisher: raeven-co/sether, workflow publish.yml). No stored token.
      # prepublishOnly runs: typecheck + lint + check:regex + test + build
      - name: Publish to npm
        run: npm publish --provenance --access public
